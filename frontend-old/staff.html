<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Portal - Triage Cases</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #f5f6fa;
            min-height: 100vh;
        }
        
        .header {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            font-size: 24px;
        }
        
        .logout-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
        }
        
        .main-container {
            display: grid;
            grid-template-columns: 350px 1fr;
            height: calc(100vh - 70px);
        }
        
        /* Case List Sidebar */
        .sidebar {
            background: white;
            border-right: 1px solid #e0e0e0;
            overflow-y: auto;
        }
        
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .sidebar-header h2 {
            font-size: 18px;
            color: #333;
        }
        
        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
        }
        
        .filter-bar {
            padding: 15px 20px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }
        
        .filter-btn {
            padding: 8px 15px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s ease;
        }
        
        .filter-btn.active {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }
        
        .case-list {
            list-style: none;
        }
        
        .case-item {
            padding: 15px 20px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .case-item:hover {
            background: #f8f9fa;
        }
        
        .case-item.selected {
            background: #e8f0ff;
            border-left: 4px solid #667eea;
        }
        
        .case-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .case-ticket {
            font-weight: bold;
            color: #333;
        }
        
        .case-time {
            font-size: 12px;
            color: #999;
        }
        
        .case-info {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }
        
        .case-risk {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            color: white;
        }
        
        .risk-red { background: #dc3545; }
        .risk-amber { background: #ffc107; color: #333; }
        .risk-green { background: #28a745; }
        
        /* Case Detail Panel */
        .detail-panel {
            padding: 30px;
            overflow-y: auto;
        }
        
        .no-case-selected {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #999;
        }
        
        .no-case-selected svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.3;
        }
        
        .case-detail {
            max-width: 800px;
        }
        
        .case-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 25px;
        }
        
        .case-header h2 {
            font-size: 28px;
            color: #333;
        }
        
        .status-badge {
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }
        
        .status-pending { background: #fff3cd; color: #856404; }
        .status-reviewed { background: #d4edda; color: #155724; }
        .status-discharged { background: #e2e3e5; color: #383d41; }
        
        .section {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        .section h3 {
            font-size: 16px;
            color: #667eea;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }
        
        .info-item label {
            display: block;
            font-size: 12px;
            color: #999;
            margin-bottom: 4px;
        }
        
        .info-item span {
            font-size: 16px;
            color: #333;
            font-weight: 500;
        }
        
        .answers-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .answer-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        
        .answer-item .question {
            color: #666;
        }
        
        .answer-item .answer {
            font-weight: 500;
            color: #333;
        }
        
        .flags-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .flag-item {
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
        }
        
        .flag-item.red { background: #f8d7da; color: #721c24; }
        .flag-item.amber { background: #fff3cd; color: #856404; }
        .flag-item.green { background: #d4edda; color: #155724; }
        
        .summary-text {
            font-size: 16px;
            line-height: 1.6;
            color: #333;
        }
        
        /* Chat Panel */
        .chat-section {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        .chat-header {
            background: #667eea;
            color: white;
            padding: 15px 20px;
            font-weight: bold;
        }
        
        .chat-messages {
            height: 300px;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
        }
        
        .message.user {
            background: #667eea;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        
        .message.assistant {
            background: #f0f0f0;
            color: #333;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        
        .message .citations {
            font-size: 12px;
            color: #666;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(0,0,0,0.1);
        }
        
        .chat-input {
            display: flex;
            padding: 15px;
            border-top: 1px solid #e0e0e0;
            gap: 10px;
        }
        
        .chat-input input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }
        
        .chat-input input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .chat-input button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        .action-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        .action-btn.primary {
            background: #28a745;
            color: white;
        }
        
        .action-btn.secondary {
            background: #6c757d;
            color: white;
        }
        
        /* Login Modal */
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .login-modal {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        
        .login-modal h2 {
            margin-bottom: 20px;
            color: #333;
        }
        
        .login-modal input {
            width: 100%;
            padding: 15px;
            font-size: 24px;
            text-align: center;
            border: 3px solid #e0e0e0;
            border-radius: 10px;
            margin-bottom: 20px;
            letter-spacing: 10px;
        }
        
        .login-modal input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .login-modal button {
            width: 100%;
            padding: 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }
        
        .login-error {
            color: #dc3545;
            margin-bottom: 15px;
            display: none;
        }
        
        .hidden {
            display: none !important;
        }
        
        .disclaimer {
            font-size: 13px;
            color: #666;
            background: #fff3cd;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <!-- Login Modal -->
    <div class="login-overlay" id="login-overlay">
        <div class="login-modal">
            <h2>🔐 Staff Login</h2>
            <p style="color: #666; margin-bottom: 20px;">Enter your PIN to access the staff portal</p>
            <div class="login-error" id="login-error">Invalid PIN. Please try again.</div>
            <input type="password" id="pin-input" maxlength="4" placeholder="••••" autocomplete="off">
            <button onclick="attemptLogin()">Login</button>
            <p style="margin-top: 20px; font-size: 12px; color: #999;">Demo PIN: 1234</p>
        </div>
    </div>
    
    <!-- Main App -->
    <div id="main-app" class="hidden">
        <div class="header">
            <h1>🏥 Staff Portal - Triage Cases</h1>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
        
        <div class="main-container">
            <!-- Sidebar: Case List -->
            <div class="sidebar">
                <div class="sidebar-header">
                    <h2>Cases</h2>
                    <button class="refresh-btn" onclick="loadCases()">↻ Refresh</button>
                </div>
                <div class="filter-bar">
                    <button class="filter-btn active" data-status="" onclick="filterCases('')">All</button>
                    <button class="filter-btn" data-status="pending" onclick="filterCases('pending')">Pending</button>
                    <button class="filter-btn" data-status="reviewed" onclick="filterCases('reviewed')">Reviewed</button>
                </div>
                <ul class="case-list" id="case-list">
                    <!-- Cases populated here -->
                </ul>
            </div>
            
            <!-- Detail Panel -->
            <div class="detail-panel" id="detail-panel">
                <div class="no-case-selected" id="no-case-msg">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                    </svg>
                    <p>Select a case from the list to view details</p>
                </div>
                
                <div class="case-detail hidden" id="case-detail">
                    <!-- Case details populated here -->
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let staffPin = null;
        let currentCaseId = null;
        let cases = [];
        
        const API_BASE = '';
        
        // Login
        async function attemptLogin() {
            const pin = document.getElementById('pin-input').value.trim();
            
            try {
                const response = await fetch(`${API_BASE}/staff/auth`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({pin: pin})
                });
                
                if (response.ok) {
                    staffPin = pin;
                    document.getElementById('login-overlay').classList.add('hidden');
                    document.getElementById('main-app').classList.remove('hidden');
                    loadCases();
                } else {
                    document.getElementById('login-error').style.display = 'block';
                }
            } catch (error) {
                console.error('Login error:', error);
                document.getElementById('login-error').style.display = 'block';
            }
        }
        
        // Enter key for login
        document.getElementById('pin-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') attemptLogin();
        });
        
        function logout() {
            staffPin = null;
            currentCaseId = null;
            document.getElementById('main-app').classList.add('hidden');
            document.getElementById('login-overlay').classList.remove('hidden');
            document.getElementById('pin-input').value = '';
            document.getElementById('login-error').style.display = 'none';
        }
        
        // Load cases
        async function loadCases(status = '') {
            try {
                let url = `${API_BASE}/staff/cases`;
                if (status) url += `?status=${status}`;
                
                const response = await fetch(url, {
                    headers: {'X-Staff-Pin': staffPin}
                });
                const data = await response.json();
                cases = data.cases;
                renderCaseList(cases);
            } catch (error) {
                console.error('Error loading cases:', error);
            }
        }
        
        // Filter cases
        function filterCases(status) {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.status === status);
            });
            loadCases(status);
        }
        
        // Render case list
        function renderCaseList(cases) {
            const list = document.getElementById('case-list');
            list.innerHTML = '';
            
            if (cases.length === 0) {
                list.innerHTML = '<li style="padding: 20px; text-align: center; color: #999;">No cases found</li>';
                return;
            }
            
            cases.forEach(c => {
                const li = document.createElement('li');
                li.className = `case-item ${currentCaseId === c.id ? 'selected' : ''}`;
                li.onclick = () => selectCase(c.id);
                
                const time = new Date(c.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                
                li.innerHTML = `
                    <div class="case-item-header">
                        <span class="case-ticket">${c.ticket_id}</span>
                        <span class="case-time">${time}</span>
                    </div>
                    <div class="case-info">${c.age}y ${c.sex} - ${c.chief_complaint}</div>
                    <span class="case-risk risk-${c.risk_band}">${c.risk_band.toUpperCase()}</span>
                `;
                
                list.appendChild(li);
            });
        }
        
        // Select case
        async function selectCase(caseId) {
            currentCaseId = caseId;
            
            // Update selection in list
            document.querySelectorAll('.case-item').forEach(item => {
                item.classList.remove('selected');
            });
            event.currentTarget.classList.add('selected');
            
            try {
                const response = await fetch(`${API_BASE}/staff/case/${caseId}`, {
                    headers: {'X-Staff-Pin': staffPin}
                });
                const caseData = await response.json();
                renderCaseDetail(caseData);
            } catch (error) {
                console.error('Error loading case:', error);
            }
        }
        
        // Render case detail
        function renderCaseDetail(caseData) {
            document.getElementById('no-case-msg').classList.add('hidden');
            const detail = document.getElementById('case-detail');
            detail.classList.remove('hidden');
            
            const time = new Date(caseData.created_at).toLocaleString();
            const demo = caseData.demographics;
            const answers = caseData.answers;
            
            let answersHtml = '';
            for (const [key, value] of Object.entries(answers)) {
                if (!key.startsWith('_') && key !== 'chief_complaint') {
                    answersHtml += `
                        <div class="answer-item">
                            <span class="question">${key.replace(/_/g, ' ')}</span>
                            <span class="answer">${typeof value === 'boolean' ? (value ? 'Yes' : 'No') : value}</span>
                        </div>
                    `;
                }
            }
            
            let flagsHtml = '';
            caseData.key_flags.forEach(flag => {
                const type = flag.includes('🔴') ? 'red' : (flag.includes('🟡') ? 'amber' : 'green');
                flagsHtml += `<div class="flag-item ${type}">${flag}</div>`;
            });
            
            let triggeredHtml = '';
            caseData.triggered_rules.forEach(rule => {
                const type = rule.band || 'amber';
                triggeredHtml += `<div class="flag-item ${type}">[${rule.band?.toUpperCase() || 'RULE'}] ${rule.description || rule.id}</div>`;
            });
            
            detail.innerHTML = `
                <div class="case-header">
                    <div>
                        <h2>${caseData.ticket_id}</h2>
                        <p style="color: #666; margin-top: 5px;">${time}</p>
                    </div>
                    <div>
                        <span class="case-risk risk-${caseData.risk_band}" style="font-size: 18px; padding: 10px 25px;">
                            ${caseData.risk_band.toUpperCase()}
                        </span>
                        <span class="status-badge status-${caseData.status}" style="margin-left: 10px;">
                            ${caseData.status.toUpperCase()}
                        </span>
                    </div>
                </div>
                
                <div class="section">
                    <h3>👤 Demographics</h3>
                    <div class="info-grid">
                        <div class="info-item">
                            <label>Age</label>
                            <span>${demo.age} years</span>
                        </div>
                        <div class="info-item">
                            <label>Sex</label>
                            <span>${demo.sex}</span>
                        </div>
                        <div class="info-item">
                            <label>Pregnant</label>
                            <span>${demo.pregnant === true ? 'Yes' : demo.pregnant === false ? 'No' : 'N/A'}</span>
                        </div>
                        <div class="info-item">
                            <label>Chief Complaint</label>
                            <span>${answers.chief_complaint || 'Unknown'}</span>
                        </div>
                    </div>
                </div>
                
                <div class="section">
                    <h3>📋 Patient Responses</h3>
                    <div class="answers-list">
                        ${answersHtml || '<p style="color: #999;">No additional responses recorded</p>'}
                    </div>
                </div>
                
                <div class="section">
                    <h3>⚠️ Key Flags</h3>
                    <div class="flags-list">
                        ${flagsHtml || '<p style="color: #999;">No flags identified</p>'}
                    </div>
                </div>
                
                <div class="section">
                    <h3>📊 Triggered Rules</h3>
                    <div class="flags-list">
                        ${triggeredHtml || '<p style="color: #999;">No rules triggered</p>'}
                    </div>
                </div>
                
                <div class="section">
                    <h3>📝 Auto-Generated Summary</h3>
                    <p class="summary-text">${caseData.summary}</p>
                </div>
                
                <div class="chat-section">
                    <div class="chat-header">💬 Ask Questions About This Case</div>
                    <div class="chat-messages" id="chat-messages">
                        <div class="message assistant">
                            Hello! I can help you understand this case. Ask me things like:
                            <br>• "Why was this patient flagged as ${caseData.risk_band}?"
                            <br>• "What follow-up questions should I ask?"
                            <br>• "Explain the risk factors"
                        </div>
                    </div>
                    <div class="chat-input">
                        <input type="text" id="chat-input" placeholder="Ask a question about this case..." onkeypress="if(event.key==='Enter')askQuestion()">
                        <button onclick="askQuestion()">Ask</button>
                    </div>
                    <div class="disclaimer">
                        ⚠️ This is decision support only. Clinical judgment is required for all patient care decisions.
                    </div>
                </div>
                
                <div class="action-buttons">
                    <button class="action-btn primary" onclick="markReviewed()">✓ Mark Reviewed</button>
                    <button class="action-btn secondary" onclick="markDischarged()">Discharge</button>
                </div>
            `;
        }
        
        // Ask question
        async function askQuestion() {
            const input = document.getElementById('chat-input');
            const question = input.value.trim();
            if (!question) return;
            
            const messages = document.getElementById('chat-messages');
            
            // Add user message
            messages.innerHTML += `<div class="message user">${question}</div>`;
            input.value = '';
            messages.scrollTop = messages.scrollHeight;
            
            try {
                const response = await fetch(`${API_BASE}/staff/case/${currentCaseId}/ask`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Staff-Pin': staffPin
                    },
                    body: JSON.stringify({question: question})
                });
                const data = await response.json();
                
                let citationsHtml = '';
                if (data.cited_data && data.cited_data.length > 0) {
                    citationsHtml = `<div class="citations">📎 Based on: ${data.cited_data.join(', ')}</div>`;
                }
                
                messages.innerHTML += `
                    <div class="message assistant">
                        ${data.answer}
                        ${citationsHtml}
                    </div>
                `;
                messages.scrollTop = messages.scrollHeight;
            } catch (error) {
                console.error('Error asking question:', error);
                messages.innerHTML += `<div class="message assistant" style="background: #f8d7da;">Sorry, I encountered an error. Please try again.</div>`;
            }
        }
        
        // Update case status
        async function markReviewed() {
            await updateStatus('reviewed');
        }
        
        async function markDischarged() {
            await updateStatus('discharged');
        }
        
        async function updateStatus(status) {
            try {
                await fetch(`${API_BASE}/staff/case/${currentCaseId}/status`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Staff-Pin': staffPin
                    },
                    body: JSON.stringify({status: status})
                });
                
                // Refresh
                loadCases();
                selectCase(currentCaseId);
            } catch (error) {
                console.error('Error updating status:', error);
            }
        }
    </script>
</body>
</html>
